<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transubtil · Releases</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07060B}
a{color:#F9BC14}a:hover{color:#FFD24D}
:focus-visible{outline:2px solid #F9BC14;outline-offset:3px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 24px}
@media(max-width:1000px){.g4{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.nav-links,.nav-cta{display:none!important}.nav-burger{display:inline-flex!important}.g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 16px}.h-page{font-size:36px!important}}
</style>
</helmet>
<div style="width: 100%; background: #07060B; color: #F3EFE4; font-family: 'Instrument Sans', sans-serif">
<dc-import name="Nav" active="releases" hint-size="100%,96px"></dc-import>

<section style="max-width: 1280px; margin: 0 auto; padding: 72px 24px 96px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 640px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #F9BC14">Catalogue</div>
<h1 class="h-page" style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 56px; line-height: 1.05; text-transform: uppercase">Releases</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #A8A5B0">EPs, albums and compilations from the label, newest first.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="sort" style="font-size: 13px; font-weight: 600; color: #A8A5B0">Sort</label>
<select id="sort" style="height: 44px; padding: 0 14px; border-radius: 10px; border: 1.5px solid #2C2A36; background: #100F16; color: #F3EFE4; font: 15px 'Instrument Sans', sans-serif"><option>Newest</option><option>By artist</option><option>Compilations</option></select>
</div>
</div>

<div class="g4">
<sc-for list="{{releases}}" as="r" hint-placeholder-count="8">
<article style="display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{r.art}}" hint-placeholder-val="{{ false }}"><img src="../assets/artwork-10-years.jpg" alt="{{r.title}} artwork" style="width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 14px"></sc-if>
<sc-if value="{{r.noArt}}" hint-placeholder-val="{{ true }}"><div style="width: 100%; aspect-ratio: 1 / 1; border-radius: 14px; background: #1B1A23; border: 1px solid #2C2A36; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #A8A5B0">[Artwork]</div></sc-if>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #F9BC14">{{r.kind}} · {{r.date}}</span>
<h2 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 600; font-size: 18px; line-height: 1.3">{{r.title}}</h2>
<span style="font-size: 15px; color: #A8A5B0">{{r.artist}}</span>
</div>
<div style="display: flex; gap: 18px; font-size: 14px; font-weight: 600">
<a href="https://soundcloud.com" style="color: #F3EFE4; text-decoration: none; border-bottom: 1.5px solid #F9BC14; padding-bottom: 2px">Listen</a>
<a href="https://bandcamp.com" style="color: #F3EFE4; text-decoration: none; border-bottom: 1.5px solid #F9BC14; padding-bottom: 2px">Buy</a>
</div>
</article>
</sc-for>
</div>
<button type="button" style="align-self: center; height: 48px; padding: 0 26px; border-radius: 999px; border: 1.5px solid #F3EFE4; background: transparent; color: #F3EFE4; font: 600 15px 'Instrument Sans', sans-serif">Load more releases</button>
</section>

<dc-import name="Footer" hint-size="100%,640px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
renderVals() {
const rel = [{ title: '10 Years of Transubtil', artist: 'Various Artists', kind: 'Compilation', date: '[2026]', art: true }];
for (let i = 2; i <= 8; i++) {
rel.push({ title: '[Release title]', artist: '[Artist 0' + (i - 1) + ']', kind: i % 3 === 0 ? 'Album' : 'EP', date: '[year]', art: false });
}
return { releases: rel.map((r) => ({ ...r, noArt: !r.art })) };
}
}
</script>
</body>
</html>
