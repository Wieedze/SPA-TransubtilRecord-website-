<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transubtil · Contact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07060B}
a{color:#F9BC14}a:hover{color:#FFD24D}
:focus-visible{outline:2px solid #F9BC14;outline-offset:3px}
input::placeholder,textarea::placeholder{color:#8C8995}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:start}
@media(max-width:820px){.nav-links,.nav-cta{display:none!important}.nav-burger{display:inline-flex!important}.split{grid-template-columns:minmax(0,1fr);gap:32px}.h-page{font-size:40px!important}.pad-box{padding:24px!important}}
</style>
</helmet>
<div style="width: 100%; background: #07060B; color: #F3EFE4; font-family: 'Instrument Sans', sans-serif">
<dc-import name="Nav" active="contact" hint-size="100%,96px"></dc-import>

<section class="split" style="max-width: 1280px; margin: 0 auto; padding: 72px 24px 112px; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #F9BC14">Contact</div>
<h1 class="h-page" style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 56px; line-height: 1.05; text-transform: uppercase">Talk to us</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #A8A5B0">Press, partnerships, a question about an order. For bookings, use the artist page: it is faster.</p>
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 12px; font-size: 16px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #A8A5B0">Direct email</span>
<a href="mailto:[contact@transubtil.com]" style="color: #F3EFE4; font-weight: 600">[contact@transubtil.com]</a>
</div>
</div>

<form class="pad-box" onSubmit="{{submit}}" style="border-radius: 18px; border: 1.5px solid #2C2A36; background: #100F16; padding: 40px; display: flex; flex-direction: column; gap: 22px">
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 14px; font-weight: 600; margin-bottom: 10px">Subject *</legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{topics}}" as="t" hint-placeholder-count="5">
<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><button type="button" aria-pressed="true" onClick="{{t.pick}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #F9BC14; background: #F9BC14; color: #07060B; font: 700 14px 'Instrument Sans', sans-serif">{{t.label}}</button></sc-if>
<sc-if value="{{t.off}}" hint-placeholder-val="{{ true }}"><button type="button" aria-pressed="false" onClick="{{t.pick}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #2C2A36; background: transparent; color: #F3EFE4; font: 600 14px 'Instrument Sans', sans-serif">{{t.label}}</button></sc-if>
</sc-for>
</div>
</fieldset>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="ct-name" style="font-size: 14px; font-weight: 600">Name *</label>
<input id="ct-name" type="text" placeholder="First and last name" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 10px; border: 1.5px solid #2C2A36; background: #07060B; color: #F3EFE4; font: 16px 'Instrument Sans', sans-serif">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="ct-mail" style="font-size: 14px; font-weight: 600">Email *</label>
<input id="ct-mail" type="email" placeholder="you@email.com" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 10px; border: 1.5px solid #2C2A36; background: #07060B; color: #F3EFE4; font: 16px 'Instrument Sans', sans-serif">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="ct-msg" style="font-size: 14px; font-weight: 600">Message *</label>
<textarea id="ct-msg" rows="6" placeholder="{{hint}}" style="box-sizing: border-box; padding: 14px 16px; border-radius: 10px; border: 1.5px solid #2C2A36; background: #07060B; color: #F3EFE4; font: 16px/1.5 'Instrument Sans', sans-serif; resize: vertical"></textarea>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<span style="font-size: 14px; color: #A8A5B0">{{status}}</span>
<button type="submit" style="height: 52px; padding: 0 28px; border: 0; border-radius: 999px; background: #F9BC14; color: #07060B; font: 700 16px 'Instrument Sans', sans-serif">Send</button>
</div>
</form>
</section>

<dc-import name="Footer" hint-size="100%,640px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const pick = s.pick || 'Press';
const hints = {
'Booking': 'For a faster reply, use the form on the artist page.',
'Press': 'Outlet, publication date, what you need…',
'Partnership': 'Your project, dates, what you offer…',
'Shop': 'Order number and question…',
'Other': 'Tell us everything.'
};
return {
topics: Object.keys(hints).map((l) => ({ label: l, on: l === pick, off: l !== pick, pick: () => this.setState({ pick: l }) })),
hint: hints[pick],
status: s.sent ? '✓ Message sent.' : 'We reply within a few days.',
submit: (e) => { e.preventDefault(); this.setState({ sent: true }); }
};
}
}
</script>
</body>
</html>
