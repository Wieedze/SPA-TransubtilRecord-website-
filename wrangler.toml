# Cloudflare Pages config — static site (dist/) + Pages Functions (functions/) + D1
name = "transubtil-records"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "transubtil-db"
# Fill with the id printed by `npx wrangler d1 create transubtil-db`
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "db/migrations"
